<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Thinking Animation Test</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: sans-serif;
    }
    .container {
      text-align: center;
      color: white;
    }
    h1 { margin: 0 0 20px 0; }
    .svg-box {
      width: 300px;
      height: 300px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .info {
      margin-top: 20px;
      font-size: 14px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤔 Thinking Animation Test</h1>
    <div class="svg-box">
      <iframe src="assets/thinking.svg"></iframe>
    </div>
    <div class="info">
      <p>检查光晕是否紧贴圆形边缘</p>
      <p>光晕应该从边框外侧开始向外扩展</p>
      <p>不应该有间距</p>
    </div>
  </div>
</body>
</html>
