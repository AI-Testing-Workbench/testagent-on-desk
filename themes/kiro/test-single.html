<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kiro Face - Single Test</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: sans-serif;
    }
    .container {
      text-align: center;
      color: white;
    }
    h1 { margin: 0 0 20px 0; }
    .svg-box {
      width: 200px;
      height: 200px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kiro Face Theme Test</h1>
    <div class="svg-box">
      <iframe src="assets/idle-follow.svg"></iframe>
    </div>
    <p style="margin-top: 20px;">如果你看到一个蓝色圆脸，说明主题正常！</p>
  </div>
</body>
</html>
